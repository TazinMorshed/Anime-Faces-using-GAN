name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  notebook-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip nbformat

      - name: Validate notebook
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path

          notebook_path = Path("anime_gan.ipynb")
          nbformat.read(notebook_path, as_version=nbformat.NO_CONVERT)
          print(f"Notebook '{notebook_path}' parsed successfully.")
          PY
